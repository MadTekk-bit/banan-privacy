<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banán – Legal & Support</title><style>
:root{
  --bg:#0f1115; --card:#171a21; --text:#f4f5f7; --muted:#b9bec8;
  --yellow:#f6c945; --border:#2b3039; --link:#ffd85a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.62;
}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 64px}
header{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:18px 0 24px;border-bottom:1px solid var(--border);margin-bottom:24px;
  flex-wrap:wrap
}
.brand{font-weight:800;font-size:22px}.brand span{color:var(--yellow)}
nav a{margin-right:16px}
h1{font-size:34px;line-height:1.2;margin:12px 0}
h2{margin-top:34px;font-size:22px}
p,li{color:var(--text)}
.muted{color:var(--muted)}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:20px;margin:18px 0
}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.langbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 24px}
.langbar button{
  border:1px solid var(--border);background:var(--card);color:var(--text);
  border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700
}
.langbar button.active{background:var(--yellow);color:#111;border-color:var(--yellow)}
.lang{display:none}.lang.active{display:block}
.notice{
  background:#2b2413;border:1px solid #6b5720;border-radius:12px;
  padding:14px 16px;margin:18px 0
}
footer{
  margin-top:40px;padding-top:18px;border-top:1px solid var(--border);
  color:var(--muted);font-size:14px
}
ul{padding-left:22px}
</style></head>
<body><div class="wrap"><header><div class="brand">🍌 <span>Banán</span> – kalorický kouč</div></header>
